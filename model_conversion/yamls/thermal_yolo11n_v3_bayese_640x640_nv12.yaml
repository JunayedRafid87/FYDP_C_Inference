# ==============================================================================
# Model Conversion Configuration for YOLO11n Thermal Model (v3)
# Target Platform: D-Robotics Horizon RDK X5 (Bayes-e BPU Architecture)
# Toolchain: OpenExplorer ai_toolchain_ubuntu_20_x5_cpu:v1.2.8
# ==============================================================================

model_parameters:
  onnx_model: 'thermal_yolo11n_v3_best.onnx'
  output_model_file_prefix: 'thermal_yolo11n_v3_bayese_640x640_nv12'
  march: 'bayes-e'

input_parameters:
  input_name: 'images'
  input_type_train: 'rgb'
  input_type_rt: 'nv12'
  input_layout_train: 'NCHW'
  input_layout_rt: 'NHWC'
  input_shape: '1x3x640x640'
  norm_type: 'data_scale'
  scale_value: [0.003921568627451, 0.003921568627451, 0.003921568627451]
  mean_value: [0.0, 0.0, 0.0]

calibration_parameters:
  cal_data_dir: './cal'
  cal_data_type: 'float32'
  calibration_type: 'default'
  max_percentile: 0.9999

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
  debug: False
  core_num: 1
